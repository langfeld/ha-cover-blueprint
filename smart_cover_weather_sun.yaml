blueprint:
  name: "Smarte Rollladensteuerung mit Wetter & Sonnenstand"
  description: >
    Steuert eine Gruppe von Rollläden automatisch nach Wettervorhersage und
    Sonnenstand.

    Morgens fahren die Rollläden zu einer festen Uhrzeit hoch. Die Höhe hängt
    dabei vom Wetter (Bewölkung), der aktuellen oder vorhergesagten Temperatur
    und der Position der Sonne (Azimuth + Elevation) ab. Ist es bewölkt,
    bleiben die Rollläden offen. Steht die Sonne im Toleranzbereich vor dem
    Fenster und ist es warm genug, wird die Sonnenschutz-Position gefahren.

    Tagsüber findet in regelmäßigen Abständen eine Neubewertung statt, damit
    die Automation auch auf sich ändernde Wetterbedingungen reagiert.

    Abends werden die Rollläden bei Sonnenuntergang geschlossen. Ein
    konfigurierbarer Ruhemodus verhindert Bewegungen in bestimmten Zeiten.

    Standard: 100 % = komplett offen, 0 % = komplett geschlossen.
    Über den Schalter „Positionen umkehren“ kann dies bei Bedarf invertiert
    werden.

    Erstelle für jede Himmelsrichtung oder Fenstergruppe eine eigene
    Automation aus diesem Blueprint.
  domain: automation
  input:
    covers:
      name: "🪟 Rollläden"
      description: >
        Wähle die Rollläden aus, die gemeinsam gesteuert werden sollen. Du kannst
        hier einzelne Rollläden oder gleich mehrere auswählen.
      selector:
        entity:
          domain: cover
          multiple: true
    weather_entity:
      name: "🌤️ Wetter-Entity"
      description: >
        Deine Wetter-Integration (z. B. OpenWeatherMap, Deutscher Wetterdienst).
        Sie liefert den aktuellen Wetterzustand und die Temperatur, die für die
        Entscheidung genutzt werden.
      selector:
        entity:
          domain: weather
    morning_time:
      name: "🌅 Morgendliche Hochfahrzeit"
      description: >
        Uhrzeit, zu der die Rollläden morgens hochfahren sollen. Zum Beispiel
        07:00:00.
      default: "07:00:00"
      selector:
        time: {}
    enable_morning:
      name: "🌄 Morgens aktivieren"
      description: >
        Schalter, ob die Rollläden morgens zur festen Uhrzeit hochfahren sollen.
      default: true
      selector:
        boolean: {}
    enable_evening:
      name: "🌇 Abends aktivieren"
      description: >
        Schalter, ob die Rollläden abends bei Sonnenuntergang geschlossen werden
        sollen. Falls du eine eigene Abend-Automation nutzt, kannst du diesen
        Schalter ausschalten.
      default: true
      selector:
        boolean: {}
    debug_mode:
      name: "🐞 Debug-Modus"
      description: >
        Wenn aktiviert, werden keine Rollläden bewegt. Stattdessen wird eine
        Benachrichtigung mit der geplanten Position und den Entscheidungsgründen
        erstellt. Ideal zum Testen, bevor die Rollläden wirklich fahren.
      default: false
      selector:
        boolean: {}
    invert_positions:
      name: "🔄 Positionen umkehren"
      description: >
        Standard in diesem Blueprint: 100 % = Rollladen komplett offen,
        0 % = komplett geschlossen. Aktiviere diese Option, wenn bei deinen
        Rollläden 100 % geschlossen und 0 % offen bedeutet. Alle eingestellten
        Positionen werden dann automatisch invertiert.
      default: false
      selector:
        boolean: {}
    enable_quiet_mode:
      name: "🔇 Ruhemodus aktivieren"
      description: >
        Wenn aktiviert, werden die Rollläden im eingestellten Zeitraum nicht
        bewegt. Praktisch z. B. für die Nachtruhe.
      default: false
      selector:
        boolean: {}
    quiet_start:
      name: "🔇 Ruhemodus Beginn"
      description: >
        Uhrzeit, ab der keine Rollladen-Bewegung mehr erfolgen soll. Der Zeitraum
        funktioniert auch über Mitternacht hinweg.
      default: "22:00:00"
      selector:
        time: {}
    quiet_end:
      name: "🔇 Ruhemodus Ende"
      description: >
        Uhrzeit, bis zu der keine Rollladen-Bewegung erfolgen soll.
      default: "07:00:00"
      selector:
        time: {}
    window_orientation:
      name: "🧭 Fenster-Ausrichtung (Azimuth)"
      description: >
        Himmelsrichtung, in die die Fenster zeigen. In Home Assistant gilt:
        0° = Nord, 90° = Ost, 180° = Süd, 270° = West.
        Beispiel: Ein Südfenster erhält den Wert 180.
      default: 180
      selector:
        number:
          min: 0
          max: 360
          step: 1
          unit_of_measurement: "°"
          mode: slider
    sun_angle_tolerance:
      name: "📐 Toleranzwinkel links/rechts"
      description: >
        Abweichung links und rechts der Fenster-Ausrichtung, in der die Sonne
        noch als "direkt auf das Fenster gerichtet" gilt. Beispiel: Bei einem
        Südfenster (180°) und einer Toleranz von 45° gilt die Sonne als
        zielgerichtet, wenn sie zwischen 135° und 225° steht.
      default: 45
      selector:
        number:
          min: 0
          max: 180
          step: 1
          unit_of_measurement: "°"
          mode: slider
    min_sun_elevation:
      name: "☀️ Minimale Sonnenhöhe (Elevation)"
      description: >
        Minimale Sonnenhöhe über dem Horizont, ab der Sonnenschutz aktiv wird.
        Damit wird verhindert, dass der Rollladen schon früh am Morgen oder spät
        am Abend in die Sonnenschutzposition fährt, wenn die Sonne noch tief
        steht. Auf -90° setzen, wenn nur der Azimuth-Winkel berücksichtigt
        werden soll.
      default: 10
      selector:
        number:
          min: -90
          max: 90
          step: 1
          unit_of_measurement: "°"
          mode: slider
    temp_threshold:
      name: "🌡️ Temperatur-Schwelle"
      description: >
        Temperatur, ab der die Sonnenschutz-Position genutzt wird. Liegt die
        Temperatur darunter, wird die normale Hoch-Position genutzt.
      default: 22
      selector:
        number:
          min: -20
          max: 45
          step: 0.5
          unit_of_measurement: "°C"
          mode: slider
    temp_source:
      name: "🌡️ Aktueller Temperatur-Sensor (optional)"
      description: >
        Optional: Ein separater Temperatur-Sensor (z. B. Außensensor). Wenn du
        mehrere Sensoren auswählst, wird der erste verwendet. Wenn nichts
        ausgewählt ist, wird die Temperatur aus dem Wetter-Entity gelesen.
      default: []
      selector:
        entity:
          device_class: temperature
          multiple: true
    use_forecast_max_temp:
      name: "📈 Tageshöchsttemperatur verwenden"
      description: >
        Wenn aktiviert, wird statt der aktuellen Temperatur der Wert des
        Tageshöchsttemperatur-Sensors verwendet. Damit wird schon morgens auf
        einen später warmen Tag reagiert, auch wenn es gerade noch kühl ist.
      default: false
      selector:
        boolean: {}
    temp_forecast_entity:
      name: "📊 Tageshöchsttemperatur-Sensor (optional)"
      description: >
        Sensor, der die vorhergesagte Tageshöchsttemperatur liefert. Wird nur
        genutzt, wenn „Tageshöchsttemperatur verwenden“ aktiviert ist.
      default: []
      selector:
        entity:
          device_class: temperature
          multiple: true
    enable_reevaluation:
      name: "🔄 Regelmäßige Neubewertung aktivieren"
      description: >
        Wenn aktiviert, wird in dem unten gewählten Intervall geprüft, ob sich
        die Position aufgrund von Wetter- oder Temperaturänderungen ändern
        sollte. So reagiert die Automation auch tagsüber auf sich ändernde
        Bedingungen.
      default: true
      selector:
        boolean: {}
    reevaluate_interval:
      name: "⏱️ Neubewertungsintervall"
      description: >
        Abstand zwischen den automatischen Neubewertungen. Der Wert wird nur
        verwendet, wenn die regelmäßige Neubewertung aktiviert ist.
      default: "30"
      selector:
        select:
          options:
            - label: "15 Minuten"
              value: "15"
            - label: "30 Minuten"
              value: "30"
            - label: "60 Minuten"
              value: "60"
          multiple: false
          mode: dropdown
    min_position_change:
      name: "↔️ Minimale Positionsänderung"
      description: >
        Der Rollladen fährt nur, wenn sich die neue Position um mindestens diesen
        Wert von der aktuellen durchschnittlichen Position unterscheidet. Damit
        wird verhindert, dass der Rollladen ständig kleine Korrekturen macht.
        Auf 0 setzen, um die Prüfung zu deaktivieren.
      default: 5
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider
    cloudy_conditions:
      name: "☁️ Bewölkte Wetterbedingungen"
      description: >
        Wähle die Wetterzustände aus, die als bewölkt gelten sollen. Bei diesen
        Zuständen fahren die Rollläden auf die eingestellte bewölkte Position
        (meistens komplett offen).
      default:
        - cloudy
        - partlycloudy
        - fog
        - rainy
        - pouring
        - snowy
        - snowy-rainy
        - hail
        - lightning
        - lightning-rainy
        - windy
        - windy-variant
        - exceptional
      selector:
        select:
          options:
            - label: Sonnig
              value: sunny
            - label: Klar (Nacht)
              value: clear-night
            - label: Teilweise bewölkt
              value: partlycloudy
            - label: Bewölkt
              value: cloudy
            - label: Nebel
              value: fog
            - label: Regen
              value: rainy
            - label: Starker Regen
              value: pouring
            - label: Schnee
              value: snowy
            - label: Schneeregen
              value: snowy-rainy
            - label: Hagel
              value: hail
            - label: Gewitter
              value: lightning
            - label: Gewitter mit Regen
              value: lightning-rainy
            - label: Windig
              value: windy
            - label: Windig, wechselhaft
              value: windy-variant
            - label: Außergewöhnlich
              value: exceptional
          multiple: true
          mode: list
    position_sunny_in_angle:
      name: "🌞 Position bei Sonne im Winkel & warm"
      description: >
        Position, wenn die Sonne im Toleranzbereich steht UND die Temperatur
        über der Schwelle liegt. Das ist deine Sonnenschutz-Position.
        Standard: 60 % (teilweise geschlossen).
        Hinweis: 100 % = komplett offen, 0 % = komplett geschlossen.
      default: 60
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider
    position_sunny_outside_angle:
      name: "🌤️ Position bei Sonne außerhalb oder zu kalt"
      description: >
        Position, wenn die Sonne NICHT im Toleranzbereich steht oder die
        Temperatur unter der Schwelle liegt. Standard: 100 % (komplett offen).
      default: 100
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider
    position_cloudy:
      name: "☁️ Position bei bewölktem Wetter"
      description: >
        Position, wenn eine der ausgewählten bewölkten Wetterbedingungen aktiv
        ist. Standard: 100 % (komplett offen).
      default: 100
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider
    evening_position:
      name: "🌙 Abend-Position"
      description: >
        Position, auf die die Rollläden bei Sonnenuntergang gefahren werden.
        Standard: 0 % (komplett geschlossen).
      default: 0
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider

variables:
  enable_morning: !input enable_morning
  enable_evening: !input enable_evening
  enable_quiet_mode: !input enable_quiet_mode
  quiet_start: !input quiet_start
  quiet_end: !input quiet_end
  enable_reevaluation: !input enable_reevaluation
  reevaluate_interval: !input reevaluate_interval

trigger:
  - platform: time
    at: !input morning_time
    id: morning
  - platform: time_pattern
    minutes: "/15"
    id: reevaluate_15
  - platform: time_pattern
    minutes: "/30"
    id: reevaluate_30
  - platform: time_pattern
    hours: "/1"
    id: reevaluate_60
  - platform: sun
    event: sunset
    id: evening

condition:
  - condition: template
    value_template: >-
      {% if not (enable_quiet_mode | bool) %}
        true
      {% else %}
        {% set n = now() %}
        {% set start = today_at(quiet_start) %}
        {% set end = today_at(quiet_end) %}
        {% if end <= start %}
          {% set end = end + timedelta(days=1) %}
        {% endif %}
        {% if n < start %}
          {% set n = n + timedelta(days=1) %}
        {% endif %}
        {{ n < start or n > end }}
      {% endif %}

action:
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {% set tid = trigger.id | default('morning') %}
              {{ (tid == 'morning' and (enable_morning | bool))
                 or (tid == 'reevaluate_15' and (enable_reevaluation | bool) and reevaluate_interval == '15')
                 or (tid == 'reevaluate_30' and (enable_reevaluation | bool) and reevaluate_interval == '30')
                 or (tid == 'reevaluate_60' and (enable_reevaluation | bool) and reevaluate_interval == '60') }}
        sequence:
          - variables:
              covers: !input covers
              weather: !input weather_entity
              orientation: !input window_orientation
              tolerance: !input sun_angle_tolerance
              min_elevation: !input min_sun_elevation
              temp_threshold: !input temp_threshold
              temp_source: !input temp_source
              temp_forecast: !input temp_forecast_entity
              use_forecast: !input use_forecast_max_temp
              cloudy: !input cloudy_conditions
              pos_sunny_in: !input position_sunny_in_angle
              pos_sunny_out: !input position_sunny_outside_angle
              pos_cloudy: !input position_cloudy
              invert: !input invert_positions
              debug_mode: !input debug_mode
              min_change: !input min_position_change
              azimuth: "{{ state_attr('sun.sun', 'azimuth') | float(0) }}"
              elevation: "{{ state_attr('sun.sun', 'elevation') | float(0) }}"
              temp: >
                {% if (use_forecast | bool) and temp_forecast | length > 0 %}
                  {{ states(temp_forecast[0]) | float(state_attr(weather, 'temperature') | float(0)) }}
                {% elif temp_source | length > 0 %}
                  {{ states(temp_source[0]) | float(state_attr(weather, 'temperature') | float(0)) }}
                {% else %}
                  {{ state_attr(weather, 'temperature') | float(0) }}
                {% endif %}
              condition_now: "{{ states(weather) }}"
              angle_diff: >
                {% set d = (azimuth - orientation) % 360 %}
                {% if d > 180 %}{{ d - 360 }}{% else %}{{ d }}{% endif %}
              is_cloudy: "{{ condition_now in cloudy }}"
              is_sunny_in_angle: >
                {{ not is_cloudy
                   and (angle_diff | abs <= tolerance)
                   and (elevation >= min_elevation)
                   and (temp >= temp_threshold) }}
              target_position: >
                {% if is_cloudy %}
                  {{ pos_cloudy }}
                {% elif is_sunny_in_angle %}
                  {{ pos_sunny_in }}
                {% else %}
                  {{ pos_sunny_out }}
                {% endif %}
              final_position: >
                {% if invert | bool %}
                  {{ 100 - (target_position | int) }}
                {% else %}
                  {{ target_position }}
                {% endif %}
              current_positions: >
                {{ expand(covers)
                   | map(attribute='attributes.current_position')
                   | map('int', -1)
                   | select('>=', 0)
                   | list }}
              avg_current_position: >
                {% if current_positions | length > 0 %}
                  {{ (current_positions | sum / current_positions | length) | int }}
                {% else %}
                  -1
                {% endif %}
              should_move: >
                {{ avg_current_position < 0
                   or (final_position - avg_current_position) | abs >= min_change }}
          - if:
              - condition: template
                value_template: "{{ debug_mode | bool }}"
            then:
              - service: persistent_notification.create
                data:
                  title: "Rollladen-Blueprint: Debug Morgens"
                  message: >
                    Geplante Position: {{ final_position }}%
                    (Berechnet: {{ target_position }}%, invertiert: {{ invert }})

                    Rollläden: {{ covers | join(', ') }}
                    Aktuelle durchschnittliche Position: {{ avg_current_position }}%
                    Bewegung nötig: {{ should_move }}
                    Auslöser: {{ trigger.id | default('manual') }}

                    Auswertung:
                    - Azimuth: {{ azimuth }}°
                    - Fenster-Ausrichtung: {{ orientation }}°
                    - Abweichung: {{ angle_diff }}°
                    - Elevation: {{ elevation }}°
                    - Temperatur: {{ temp }}°C
                    - Wetterzustand: {{ condition_now }}
                    - Bewölkt: {{ is_cloudy }}
                    - Sonne im Winkel & warm: {{ is_sunny_in_angle }}
            else:
              - if:
                  - condition: template
                    value_template: "{{ should_move | bool }}"
                then:
                  - service: cover.set_cover_position
                    target:
                      entity_id: !input covers
                    data:
                      position: "{{ final_position }}"

      - conditions:
          - condition: trigger
            id: evening
          - condition: template
            value_template: "{{ enable_evening | bool }}"
        sequence:
          - variables:
              covers: !input covers
              evening_pos: !input evening_position
              invert: !input invert_positions
              debug_mode: !input debug_mode
              final_evening_pos: >
                {% if invert | bool %}
                  {{ 100 - (evening_pos | int) }}
                {% else %}
                  {{ evening_pos }}
                {% endif %}
          - if:
              - condition: template
                value_template: "{{ debug_mode | bool }}"
            then:
              - service: persistent_notification.create
                data:
                  title: "Rollladen-Blueprint: Debug Abends"
                  message: >
                    Geplante Position: {{ final_evening_pos }}%
                    (Berechnet: {{ evening_pos }}%, invertiert: {{ invert }})

                    Rollläden: {{ covers | join(', ') }}

                    Auslöser: {{ trigger.id | default('manual') }}
            else:
              - service: cover.set_cover_position
                target:
                  entity_id: !input covers
                data:
                  position: "{{ final_evening_pos }}"
